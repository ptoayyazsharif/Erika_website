# nginx, in front of php-fpm, inside the app container.
#
# Listens on 8080, not 80 — nothing here needs a privileged port, and Coolify's
# proxy terminates TLS and forwards to whatever the container exposes.
#
# The master process starts as root and workers drop to www-data, which is the
# same arrangement php-fpm uses. Running the master as www-data too looks
# tempting and fails immediately: nginx re-opens its log paths by name, and
# /dev/stderr inside a container resolves to a root-owned pipe, so an
# unprivileged master dies with "open() /dev/stderr failed (13: Permission
# denied)" before it has read a single request.
user www-data;
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Everything nginx needs to write goes to /tmp, so the image itself can stay
    # read-only apart from the storage volume.
    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    # Don't advertise the version to someone scanning for a known nginx CVE.
    server_tokens off;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 30;

    # Two vision images per desire at 4 MB each (config/escalate.php → images),
    # plus multipart overhead. Anything larger is rejected here rather than
    # being read into PHP first.
    client_max_body_size 10m;
    client_body_buffer_size 256k;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/manifest+json image/svg+xml;

    # Combined, minus the client address — Coolify already records the request
    # and this app's users are its whole subject matter. Access logs of a
    # private journal are themselves personal data, so keep them thin.
    log_format thin '$request_method $uri $status $body_bytes_sent ${request_time}s';
    access_log /dev/stdout thin;

    server {
        # IPv4 only, on purpose. A `listen [::]:8080` line here is a common
        # addition and it makes nginx refuse to start outright — "Address
        # family not supported by protocol" — on any Docker host with IPv6
        # disabled, which is the default. Coolify's proxy reaches this
        # container over the IPv4 Docker network.
        listen 8080 default_server;
        server_name _;

        root /var/www/html/public;
        index index.php;

        charset utf-8;

        # The manifest must be served as application/manifest+json or Chrome
        # refuses to install the PWA. nginx's mime.types does not know it.
        location = /manifest.webmanifest {
            default_type application/manifest+json;
        }

        # The service worker must never be cached by the browser for long, or a
        # deploy cannot reach clients that already installed the app.
        location = /sw.js {
            add_header Cache-Control "no-cache, must-revalidate" always;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        # Static shell assets. Not content-hashed, so an aggressive max-age
        # would strand users on an old stylesheet after a deploy; an hour plus
        # revalidation is the compromise.
        #
        # `expires` is deliberately absent: it emits its own Cache-Control, so
        # pairing it with add_header sends the header twice and leaves which
        # one wins up to the client.
        location ~* ^/(css|js)/ {
            add_header Cache-Control "public, max-age=3600, must-revalidate" always;
            access_log off;
        }

        location ~* ^/(fonts|icons)/ {
            add_header Cache-Control "public, max-age=2592000, immutable" always;
            access_log off;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Only ever hand index.php to PHP.
        #
        # Matching a bare `\.php$` is the classic path-traversal footgun: a
        # request for /uploads/evil.png/x.php would match, and with
        # cgi.fix_pathinfo on, PHP would happily execute the png. This app has a
        # single entry point, so it is named literally and nothing else in the
        # tree is ever passed to the interpreter.
        location = /index.php {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_hide_header X-Powered-By;

            # Deliberately not setting a HTTPS fastcgi_param. The obvious
            # `fastcgi_param HTTPS $http_x_forwarded_proto if_not_empty` is a
            # trap: on a plain-HTTP request it sets HTTPS to the string "http",
            # which PHP reads as truthy, and the app would believe every
            # request was secure. Laravel's trusted-proxy layer reads
            # X-Forwarded-Proto itself and gets this right.

            # Requests are cheap — every expensive thing (writing a reading,
            # rendering narration) is a queued job, not a web request.
            fastcgi_read_timeout 60;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }

        # Any other .php is a 404, not an execution.
        location ~ \.php$ {
            return 404;
        }

        # Dotfiles. public/ contains none, but this is the layer that would have
        # saved a misconfigured document root from serving .env, so it stays.
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
