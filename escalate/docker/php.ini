; Production PHP settings for the Escalate container.
; Loaded last (zz- prefix) so it wins over anything in the base image.

; ── Disclosure ───────────────────────────────────────────────────────────────
; Errors are Laravel's job. If PHP ever renders one itself it does so before
; the framework's handler is in place, which means no APP_DEBUG check and no
; redaction — a stack trace on screen with $_ENV in it.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Don't announce the PHP version in response headers.
expose_php = Off

; ── Environment visibility ───────────────────────────────────────────────────
; E must be in the list. Without it $_ENV is empty, and while Laravel's env()
; also reads getenv(), anything that looks at $_ENV directly silently sees
; nothing — which in practice means APP_KEY reading as null and every
; encrypted field failing to decrypt.
variables_order = "EGPCS"

; ── Uploads ──────────────────────────────────────────────────────────────────
; config/escalate.php caps a vision image at 4 MB; these sit above it so the
; app's own validation message is what a user sees, not a truncated POST.
upload_max_filesize = 8M
post_max_size = 10M
max_file_uploads = 4

memory_limit = 256M
max_execution_time = 60

; ── Sessions ─────────────────────────────────────────────────────────────────
; Laravel drives sessions through the database, but harden the PHP defaults
; anyway so nothing falls back to a weaker cookie.
session.cookie_httponly = 1
session.use_strict_mode = 1
session.cookie_samesite = "Lax"

; ── OPcache ──────────────────────────────────────────────────────────────────
; The code in an image never changes, so revalidation is pure overhead. Note
; the consequence: editing a file inside a running container has no effect
; until it restarts. That is the intended behaviour for a deployed image.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.fast_shutdown = 1

; ── Misc ─────────────────────────────────────────────────────────────────────
; PATH_INFO belongs off with a single entry point; combined with the literal
; `location = /index.php` in nginx it closes the "upload a .png, execute it as
; .php" family of bugs from both ends.
cgi.fix_pathinfo = 0

date.timezone = UTC
realpath_cache_size = 4096k
realpath_cache_ttl = 600
