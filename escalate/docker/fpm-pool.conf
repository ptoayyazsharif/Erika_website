; php-fpm pool overrides. Loaded after zz-docker.conf, so this wins.

[global]
daemonize = no
error_log = /dev/stderr
log_limit = 8192

[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000

; nginx is the only thing on the other end of that socket, and it is in this
; same container. Nothing outside can reach 9000 — but say so anyway, because
; an exposed FastCGI port is remote code execution, not an information leak.
listen.allowed_clients = 127.0.0.1

; The one line that makes environment variables work.
;
; php-fpm defaults to clear_env = yes, which wipes the worker's environment
; before the first request. In a container that is catastrophic and silent:
; APP_KEY, the database credentials and both API keys are passed in as
; environment variables, and every one of them would read as null. The app
; would boot, render the login page, and fail only when something tried to
; decrypt.
clear_env = no

pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5

; Recycle workers periodically. Nothing here is known to leak, but a long-lived
; worker holding a 4 MB upload buffer is a slow way to find out.
pm.max_requests = 500

; Surface anything a worker writes to stdout/stderr in the container log,
; undecorated so Laravel's own log lines stay parseable.
catch_workers_output = yes
decorate_workers_output = no

; The health endpoint nginx and Docker probe. Off by default; harmless, and it
; is what tells you whether a hung request is PHP or the queue.
pm.status_path = /fpm-status
ping.path = /fpm-ping

; A request that takes this long is stuck — every genuinely slow operation in
; this app (writing a reading, rendering narration) runs on the queue.
request_terminate_timeout = 75
request_slowlog_timeout = 15
slowlog = /dev/stderr

; Do not log the request line for every hit; it is the same personal data
; concern as the nginx access log.
access.log = /dev/null
