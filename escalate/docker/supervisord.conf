; Three processes, one container: nginx, php-fpm, and the queue worker.
;
; The queue worker is not optional garnish. Writing a reading and rendering
; narration are both queued jobs — with no worker, every reveal screen polls
; "Reading your intentions" forever and it looks exactly like the AI being
; broken. Running it beside the web server is what makes this image
; self-contained.

[supervisord]
nodaemon = true
user = root
logfile = /dev/null
logfile_maxbytes = 0
pidfile = /tmp/supervisord.pid
loglevel = info

[unix_http_server]
file = /tmp/supervisor.sock
chmod = 0700

[supervisorctl]
serverurl = unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; ── php-fpm ──────────────────────────────────────────────────────────────────
; Starts as root so the pool can drop to www-data itself, exactly as the
; official image intends.
[program:php-fpm]
command = /usr/local/sbin/php-fpm --nodaemonize --force-stderr
autostart = true
autorestart = true
priority = 10
startsecs = 3
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

; ── nginx ────────────────────────────────────────────────────────────────────
; Master as root so it can open /dev/stderr; workers drop to www-data via the
; `user` directive in nginx.conf. Port 8080, so nothing needs CAP_NET_BIND.
[program:nginx]
command = /usr/sbin/nginx -g "daemon off;"
autostart = true
autorestart = true
priority = 20
startsecs = 3
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

; ── scheduler ────────────────────────────────────────────────────────────────
; `schedule:work` is a long-running process that wakes every minute and runs
; whatever is due, so it needs no crontab in the image and no host cron.
;
; Nothing recurring in this app could run at all before this existed. If it is
; not running, scheduled work does not fail loudly — it simply never happens,
; which is the worst way for a reminder to be broken. `artisan schedule:list`
; inside the container is the check.
;
; --memory=128 and supervisor's restart are the whole leak strategy: this
; process is meant to live for weeks.
[program:schedule]
command = /usr/local/bin/php /var/www/html/artisan schedule:work
          --memory=128
          --no-interaction
directory = /var/www/html
user = www-data
autostart = true
autorestart = true
priority = 35
startsecs = 5
; A task in flight gets time to finish rather than being cut off mid-send.
stopwaitsecs = 60
stopsignal = TERM
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

; ── queue worker ─────────────────────────────────────────────────────────────
; --timeout=240 matches NarrateStory's own timeout, and DB_QUEUE_RETRY_AFTER
; must stay above it (300 in .env.example) or the database queue hands a
; still-running job to a second worker and you are billed twice for one
; narration.
;
; --max-time=3600 retires the worker every hour so a leak can never
; accumulate; supervisor restarts it immediately. --tries=2 because a failed
; generation should surface to the user quickly, not be retried into the
; user's daily quota.
[program:queue]
command = /usr/local/bin/php /var/www/html/artisan queue:work
          --tries=2
          --timeout=240
          --sleep=3
          --max-time=3600
          --memory=192
          --no-interaction
directory = /var/www/html
user = www-data
autostart = true
autorestart = true
priority = 30
startsecs = 5
stopwaitsecs = 250
; SIGTERM lets Laravel finish the job in hand before exiting; killing a worker
; mid-narration leaves a story stuck in 'rendering' with nothing to retry it.
stopsignal = TERM
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
