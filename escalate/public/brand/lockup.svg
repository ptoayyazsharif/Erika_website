<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="Escalate">
  <title>Escalate</title>

  <!--
    Mark plus wordmark.

    The word is set in Lora — the serif the app already self-hosts — tracked
    wide, because generous letterspacing is what buys "sophisticated" from a
    text face that is not a display cut. A true high-contrast display serif is
    a later change; this is honest about being the interim.

    currentColor throughout the letterforms, so one file serves both ivory and
    aubergine without a second copy of anything.

    The transform below places the mark at x 40→216, y 40→278 inside the box.
    Getting that wrong clips the top arm, which is exactly what the first
    version did.
  -->

  <defs>
    <linearGradient id="lockLight" x1="0" y1="1" x2="0.3" y2="0">
      <stop offset="0%"   stop-color="#4966B3"/>
      <stop offset="50%"  stop-color="#7456C7"/>
      <stop offset="100%" stop-color="#9A7CF0"/>
    </linearGradient>
    <radialGradient id="lockSpill" cx="0.5" cy="0" r="1">
      <stop offset="0%"   stop-color="#9A7CF0" stop-opacity="0.42"/>
      <stop offset="55%"  stop-color="#7456C7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#4966B3" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g transform="translate(-34.4 -7.1) scale(0.62)">
    <g fill="currentColor">
      <path d="M120 76 h56 v360 h-56 z"/>
      <path d="M120 76 h248 v48 h-248 z"/>
      <path d="M120 196 h192 v44 h-192 z"/>
      <path d="M120 388 h224 l60 -20 v46 l-60 20 h-224 z"/>
    </g>
    <path d="M220 388 v-68 a42 42 0 0 1 84 0 v68 z" fill="url(#lockLight)"/>
    <path d="M220 388 h84 l38 72 h-160 z" fill="url(#lockSpill)"/>
  </g>

  <text x="266" y="176" fill="currentColor"
        font-family="Lora, Georgia, 'Times New Roman', serif"
        font-size="112" font-weight="500" letter-spacing="17">ESCALATE</text>

  <text x="270" y="232" fill="currentColor" opacity="0.62"
        font-family="Raleway, system-ui, sans-serif"
        font-size="24" font-weight="500" letter-spacing="3.4">IMAGINE IT FORWARD. UNDERSTAND IT BACKWARD.</text>
</svg>
