<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Escalate">
  <title>Escalate</title>

  <!--
    The doorway E.
    ============================================================================
    The one failure available to this mark is reading as an F, and the first
    attempt found a second one: a doorway placed mid-letter ate the middle arm
    and turned the whole thing into a bracket with a lamp in it.

    So the doorway lives in the LOWER COUNTER — the open space between the
    middle arm and the bottom arm, right of the stem. That space is genuinely
    part of the letter's negative space, it is the largest opening an E has, and
    putting the door there leaves all three arms untouched.

    Against the F reading, three deliberate choices:

      1. The bottom arm is the longest stroke in the mark (120→404 against the
         top's 120→368). An F has no bottom arm at all, so making it the most
         emphatic horizontal is what forecloses the misreading.
      2. It lifts at the tip. A rise of 20px over the last 60 reads as forward
         movement, and is a gesture no F makes.
      3. The middle arm is the shortest (120→312), which is characteristically
         E and keeps the eye moving down to the bottom arm rather than stopping.

    Proportions are drawn for the small end: at 32px the arms still separate,
    the door is a recognisable arch, and the gradient resolves as light rather
    than as a smudge. The arch stops 38px below the middle arm rather than
    kissing it: at icon size that gap is the difference between a door in a
    letter and a single merged blob.
  -->

  <defs>
    <linearGradient id="light" x1="0" y1="1" x2="0.3" y2="0">
      <stop offset="0%"   stop-color="#4966B3"/>
      <stop offset="50%"  stop-color="#7456C7"/>
      <stop offset="100%" stop-color="#9A7CF0"/>
    </linearGradient>

    <radialGradient id="spill" cx="0.5" cy="0" r="1">
      <stop offset="0%"   stop-color="#9A7CF0" stop-opacity="0.45"/>
      <stop offset="55%"  stop-color="#7456C7" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#4966B3" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g fill="currentColor">
    <!-- stem -->
    <path d="M120 76 h56 v360 h-56 z"/>
    <!-- top arm -->
    <path d="M120 76 h248 v48 h-248 z"/>
    <!-- middle arm — the shortest of the three, on purpose -->
    <path d="M120 196 h192 v44 h-192 z"/>
    <!--
      Bottom arm: longest, and rising at the tip. One path rather than an arm
      plus a wedge, so the lift is part of the stroke instead of a flag stuck
      on the end of it.
    -->
    <path d="M120 388 h224 l60 -20 v46 l-60 20 h-224 z"/>
  </g>

  <!-- The doorway, standing on the bottom arm, in the lower counter. -->
  <path d="M220 388 v-68 a42 42 0 0 1 84 0 v68 z" fill="url(#light)"/>

  <!-- What it throws forward onto the floor. -->
  <path d="M220 388 h84 l38 72 h-160 z" fill="url(#spill)"/>
</svg>
