; Raise PHP limits so the admin can upload large photos and videos (up to 300 MB).
; On cPanel this file is read automatically. If your host ignores it, set the same
; values in cPanel -> MultiPHP INI Editor. Very large uploads can still time out
; depending on the host's own proxy/CDN limits.
upload_max_filesize = 300M
post_max_size = 320M
memory_limit = 512M
max_execution_time = 600
max_input_time = 600
